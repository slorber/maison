# Build : npm ci (dépendances de développement comprises : TypeScript, Vite), puis vérification des types et build Vite.
# Seul dist/index.html est publié : la page est autonome (JS et CSS inline, textures dessinées au chargement).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# page entièrement autonome : pas de cache long sur l'index
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
